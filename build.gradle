plugins {
    id 'java'
    id 'war'
}

group = 'vn.fit'
version = '1.0-SNAPSHOT'

repositories { mavenCentral() }

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'
    implementation 'org.glassfish.jersey.containers:jersey-container-servlet:3.1.9'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.9'
    implementation 'org.glassfish.jersey.media:jersey-media-json-binding:3.1.9'
    implementation 'org.glassfish.jersey.ext.cdi:jersey-cdi1x-servlet:3.1.9'
    implementation 'org.jboss.weld.servlet:weld-servlet-shaded:5.1.3.Final'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.5.1'
}